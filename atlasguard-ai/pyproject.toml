[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlasguard-ai"
version = "0.1.0"
description = "Explainable fraud detection lab: Parquet, DuckDB, chronological ML and monitoring"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<3", "pyarrow>=16,<24",
  "duckdb>=1.1,<2", "scikit-learn>=1.5,<2", "joblib>=1.4,<2",
  "streamlit>=1.50,<2", "plotly>=5.24,<7", "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1", "matplotlib>=3.8,<4"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["atlasguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
